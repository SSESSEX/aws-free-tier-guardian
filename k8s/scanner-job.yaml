apiVersion: batch/v1
kind: Job
metadata:
  name: aws-guardian-scan
  namespace: aws-guardian
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: aws-guardian-scanner
    spec:
      restartPolicy: Never
      containers:
        - name: scanner
          image: aws-free-tier-guardian-scanner:local
          imagePullPolicy: Never
          command:
            - python
            - -m
            - app.scanner.run_all
            - --write-db
          env:
            - name: AWS_PROFILE
              value: guardian-dev
            - name: AWS_DEFAULT_REGION
              value: eu-west-2
            - name: REPORT_OUTPUT_DIR
              value: reports
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guardian-app-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: aws-credentials
              mountPath: /root/.aws
              readOnly: true
            - name: reports
              mountPath: /app/reports
      volumes:
        - name: aws-credentials
          secret:
            secretName: guardian-aws-credentials
        - name: reports
          emptyDir: {}